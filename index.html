<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f4" />
    <title>OOS · 凉皮的个人操作系统</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=6.1.0-runtime" />
    <link rel="stylesheet" href="./calendar.css?v=1.0.0" />
    <link rel="stylesheet" href="./public-overrides.css?v=6.0.0-runtime" />
    <link rel="manifest" href="./manifest.json" />
    <style>
      /* 右下角「更新 / 同步」浮标，参照 Focus App 的同步按钮 */
      #syncFab {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 60;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border: none;
        border-radius: 999px;
        background: #10b981;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #syncFab:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.45); }
      #syncFab:active { transform: scale(0.96); }
      #syncFab .sync-icon { font-size: 16px; line-height: 1; }
      #syncFab.spinning .sync-icon { animation: oos-spin 0.8s linear infinite; }
      @keyframes oos-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
      /* 任务完成后整卡淡出提示 */
      .task-card.is-done .task-title strong { text-decoration: line-through; opacity: 0.6; }
      @media (max-width: 640px) {
        #syncFab { right: 14px; bottom: 14px; padding: 11px 15px; }
        #syncFab .sync-label { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="launcher" aria-label="OOS 导航">
        <button class="brand" type="button" data-view="today" aria-label="回到今日">
          <span class="brand-orbit" aria-hidden="true"><i></i></span>
          <span><strong>OOS</strong><small>Odyssey</small></span>
        </button>
        <nav class="nav" aria-label="核心导航">
          <span class="nav-label">Core</span>
          <button class="nav-item active" data-view="today"><i>01</i><span>Today</span></button>
          <button class="nav-item" data-view="plan"><i>02</i><span>Plan</span></button>
          <button class="nav-item" data-view="tracks"><i>03</i><span>Tracks</span></button>
          <div class="nav-tracks" id="navTracks" aria-label="我的轨道"></div>
        </nav>
        <div class="launcher-foot"><i id="railHealth"></i><span id="railStatus">连接中</span></div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div><p id="dateLine">正在读取当前状态…</p><h1 id="pageTitle">Today</h1></div>
          <label class="search"><span>搜索</span><input id="searchInput" type="search" placeholder="搜索任务、笔记与轨道" /></label>
        </header>

        <section class="hero" id="hero">
          <div class="hero-copy"><span class="eyebrow" id="heroEyebrow">NOW / CURRENT VECTOR</span><h2 id="heroTitle">先找到今天的主航向。</h2><p id="heroSubtitle">状态、行动和上下文会在这里汇合。</p></div>
          <img class="hero-visual" id="heroVisual" alt="个性化 OOS 场景" hidden />
          <div class="journey-geometry" aria-hidden="true"><svg viewBox="0 0 640 240" preserveAspectRatio="none"><path class="route-shadow" d="M-20 202 C90 198 88 64 208 82 S354 218 430 126 S546 18 675 44"/><path class="route" d="M-20 202 C90 198 88 64 208 82 S354 218 430 126 S546 18 675 44"/><circle cx="208" cy="82" r="6"/><circle cx="430" cy="126" r="6"/><circle cx="602" cy="37" r="10"/><path class="contour" d="M60 18 C142 50 112 134 190 176 M468 238 C500 172 578 190 646 130"/></svg><span>YOU ARE HERE</span></div>
        </section>

        <section id="viewContent" class="view-content" aria-live="polite">
          <div class="loading"><i></i><strong>正在建立航线</strong><span>读取状态、日程与轨道…</span></div>
        </section>
      </main>
    </div>
    <div id="overlayRoot"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./static-shim.js?v=2"></script>
  <script src="./calendar-engine.js?v=1.0.0"></script>
  <script src="./calendar-ui.js?v=1.0.0"></script>
    <script src="./oos-client.js?v=5.0.0"></script>
    <script src="./app.js?v=7.0.0-v6"></script>
    <script src="./oos-enhance.js?v=2"></script>
    <script src="./oos-modules.js?v=1"></script>
    <script src="./oos-sync.js?v=3"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#10b981" />
<title>OOS · 凉皮的个人操作系统</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="./assets/visuals/avatar-cover.png" />
<style>
  :root{
    --accent:#10b981;
    --accent-soft:rgba(16,185,129,.14);
    --bg:#0b0f0d;
    --bg-2:#0e1512;
    --card:rgba(255,255,255,.05);
    --card-border:rgba(255,255,255,.10);
    --text:#eaf3ef;
    --muted:#8aa79c;
    --warn:#c3542f;
    --ok:#14865b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(16,185,129,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(16,185,129,.10), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
    min-height:100%;
    padding:clamp(18px,4vw,48px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto}
  .hero{display:flex;align-items:center;gap:22px;margin-bottom:34px;flex-wrap:wrap}
  .hero .avatar{
    width:84px;height:84px;border-radius:24px;object-fit:cover;
    border:1px solid var(--card-border);
    box-shadow:0 10px 40px rgba(16,185,129,.25);
  }
  .hero h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.5px}
  .hero h1 .g{background:linear-gradient(90deg,#34d399,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin-top:6px;font-size:15px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:#7ef0c2;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid rgba(16,185,129,.3);margin-top:10px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}

  h2.section{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:38px 0 16px;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:20px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s,border-color .35s;
  }
  .card:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,.35);border-color:rgba(16,185,129,.4)}
  .track-head{display:flex;gap:14px;align-items:center}
  .track-head img{width:64px;height:64px;border-radius:18px;object-fit:cover;border:1px solid var(--card-border)}
  .track-name{font-size:18px;font-weight:700}
  .track-sum{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
  .progress{height:8px;background:rgba(255,255,255,.08);border-radius:999px;margin:16px 0 12px;overflow:hidden}
  .progress > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#10b981);box-shadow:0 0 14px rgba(16,185,129,.6)}
  .next{font-size:13.5px;line-height:1.5}
  .next b{color:#7ef0c2;font-weight:600}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tag{font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--card-border)}
  .tag.risk-high{color:#ffb4a0;background:rgba(195,84,47,.14);border-color:rgba(195,84,47,.35)}
  .tag.risk-med{color:#ffd9a0;background:rgba(201,138,47,.14);border-color:rgba(201,138,47,.35)}

  .views{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .view{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--card-border);background:var(--card)}
  .view img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.16,1,.3,1)}
  .view:hover img{transform:scale(1.05)}
  .view span{position:absolute;left:0;bottom:0;right:0;padding:8px 10px;font-size:12px;font-weight:600;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent);color:#eaf3ef}

  .tasks{display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px 14px}
  .task .ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);flex:0 0 auto;position:relative}
  .task .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
  .task .t-title{font-size:14px;flex:1}
  .task .t-goal{font-size:11.5px;color:var(--muted)}
  .task .pri{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
  .pri.high{color:#ffb4a0;background:rgba(195,84,47,.14)}
  .pri.normal{color:#9fd8ff;background:rgba(60,140,200,.14)}

  footer{margin-top:46px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
  footer a{color:#7ef0c2;text-decoration:none}
  .loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="avatar" id="avatar" src="./assets/visuals/avatar-cover.png" alt="凉皮" />
      <div>
        <h1>OOS · <span class="g">凉皮的个人操作系统</span></h1>
        <p id="subtitle">Personal Operating System — 随时教练 / just-in-time</p>
        <div class="badge"><span class="dot"></span><span id="badge-text">随时教练已就绪</span></div>
      </div>
    </header>

    <div id="app">
      <div class="loading">正在加载你的 OOS…</div>
    </div>

    <footer>
      由 <b>Focus 执行教练</b> 维护 · 公网展示版<br/>
      想看完整「随时教练」能力，请与你的 AI 教练对话更新。
    </footer>
  </div>

<script>
const fix = p => (p || "").startsWith("/assets") ? "." + p : p;

async function load(){
  let data;
  try{
    const res = await fetch("./state.json?v=" + Date.now());
    data = await res.json();
  }catch(e){
    document.getElementById("app").innerHTML = '<div class="loading">数据加载失败，请稍后刷新。</div>';
    return;
  }
  render(data);
}

function riskClass(r){ return r==="high" ? "risk-high" : r==="medium" ? "risk-med" : ""; }

function render(d){
  const owner = (d.meta && d.meta.owner) || "凉皮";
  const tracks = d.tracks || [];
  const assetTracks = (d.visual && d.visual.assets && d.visual.assets.tracks) || {};
  const assetViews = (d.visual && d.visual.assets && d.visual.assets.views) || {};
  const tasks = (d.tasks || []).filter(t => t.status === "open").slice(0,6);

  document.getElementById("avatar").src = fix(assetViews.today) || "./assets/visuals/avatar-cover.png";
  document.getElementById("subtitle").textContent = "Personal Operating System — " + ((d.profile && d.profile.useRhythm && d.profile.useRhythm[0]) || "随时教练");

  let html = "";

  // Tracks
  html += '<h2 class="section">三条轨道 · 专属人物</h2><div class="grid">';
  tracks.forEach(t=>{
    const img = fix(assetTracks[t.name]) || fix(assetViews.track) || "./assets/visuals/view-track.png";
    const prog = Math.max(0, Math.min(100, Number(t.progress)||0));
    html += `
      <div class="card">
        <div class="track-head">
          <img src="${img}" alt="${t.name}" />
          <div>
            <div class="track-name">${t.name}</div>
            <div class="track-sum">${t.summary || ""}</div>
          </div>
        </div>
        <div class="progress"><i style="width:${prog}%"></i></div>
        <div class="next">下一步 · <b>${t.nextAction || "—"}</b></div>
        <div class="tags">
          <span class="tag ${riskClass(t.risk)}">风险 ${t.risk || "—"}</span>
          <span class="tag">阶段 ${t.stage || "—"}</span>
          <span class="tag">进度 ${prog}%</span>
        </div>
      </div>`;
  });
  html += '</div>';

  // Views preview
  const viewKeys = [["today","今日"],["plan","规划"],["tracks","轨道"],["track","详情"],["review","复盘"]];
  const hasViews = viewKeys.some(([k])=>assetViews[k]);
  if(hasViews){
    html += '<h2 class="section">界面预览 · 各视图人物</h2><div class="views">';
    viewKeys.forEach(([k,label])=>{
      const v = fix(assetViews[k]);
      if(v) html += `<div class="view"><img src="${v}" alt="${label}"/><span>${label}</span></div>`;
    });
    html += '</div>';
  }

  // Tasks
  if(tasks.length){
    html += '<h2 class="section">进行中事项</h2><div class="tasks">';
    tasks.forEach(t=>{
      const pri = t.priority === "high" ? "high" : "normal";
      html += `
        <div class="task">
          <span class="ring"></span>
          <span class="t-title">${t.title}</span>
          <span class="t-goal">${t.goal || ""}</span>
          <span class="pri ${pri}">${pri==="high"?"高":"普通"}</span>
        </div>`;
    });
    html += '</div>';
  }

  document.getElementById("app").innerHTML = html;
}

load();

// PWA 注册
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
